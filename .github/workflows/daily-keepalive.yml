name: LifeSync AI — Daily Keep-Alive & Database Probe

# Run daily at 12:00 PM IST (Asia/Kolkata, UTC+05:30 -> 06:30 AM UTC)
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

concurrency:
  group: lifesync-daily-keepalive
  cancel-in-progress: false

jobs:
  keepalive-check:
    name: Execute Daily Database Keep-Alive
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Run Keep-Alive Probe & Notification Runner
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || secrets.BACKEND_URL || 'https://lifesync-api-3x29.onrender.com' }}
          EmailSettings__ApiKey: ${{ secrets.EmailSettings__ApiKey }}
          EmailSettings__Provider: ${{ secrets.EmailSettings__Provider || 'Brevo' }}
          EmailSettings__SenderEmail: ${{ secrets.EmailSettings__SenderEmail || 'roomsmessage999@gmail.com' }}
          EmailSettings__SenderName: ${{ secrets.EmailSettings__SenderName || 'LifeSync Support' }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || 'gdarshil1203@gmail.com' }}
          KeepAliveSettings__SecretKey: ${{ secrets.KeepAliveSettings__SecretKey || 'LifeSync_KeepAlive_Secret_2026_Key!' }}
        run: |
          python .github/scripts/keepalive_runner.py
